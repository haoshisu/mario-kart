services:
  - type: web
    name: kart-lab-race
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: MAX_ROOMS
        value: '1'
      - key: ALLOWED_ORIGINS
        value: https://mario-kart.sshnick.com
